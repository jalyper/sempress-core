[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sempress"
version = "0.1.1"
description = "Semantic compression for numeric tabular data via learned vector quantization"
authors = [{name = "Keaton Anderson"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["compression", "vector-quantization", "kmeans", "tabular-data", "csv", "iot", "time-series"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: System :: Archiving :: Compression",
]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "click>=8.1",
  "msgpack>=1.0",
  "zstandard>=0.22",
  "scipy>=1.11"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-json-report>=1.5"
]

[project.urls]
Homepage = "https://github.com/jalyper/sempress-core"
Repository = "https://github.com/jalyper/sempress-core"
Issues = "https://github.com/jalyper/sempress-core/issues"

[project.scripts]
sempress = "sempress.cli:main"

[tool.pytest.ini_options]
addopts = "--json-report --json-report-file=logs/pytest-report.json"
